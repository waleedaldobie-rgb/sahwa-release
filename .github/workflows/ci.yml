name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality, tests, and Electron integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static guard for legacy IPC callers
        run: npm run check:legacy-ipc

      - name: Test legacy IPC static guard
        run: npm run test:legacy-ipc

      - name: TypeScript and lint quality gate
        run: npm run quality

      - name: Unit tests
        run: npm test

      - name: Build Electron renderer
        run: npm run build:electron:renderer

      - name: Build Electron main and preload bundles
        run: npm run build:electron

      - name: Electron SQLite integration regression
        run: xvfb-run -a npm run test:integration
